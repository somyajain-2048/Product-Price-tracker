<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PriceTrack — Real-Time Price Tracker for Amazon & Flipkart</title>
    
    <!-- Primary SEO Meta Tags -->
    <meta name="description" content="Track product prices across Amazon, Flipkart, and Myntra in real-time. Receive instant email alerts when prices drop and analyze 90-day price history to buy at the best price." />
    <meta name="keywords" content="price tracker, amazon price history, flipkart price tracker, deal alerts, price drop notifier, price tracker India" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PriceTrack" />
    <meta property="og:title" content="PriceTrack — Never Overpay Again" />
    <meta property="og:description" content="Track prices on Amazon, Flipkart & Myntra. Get instant price drop alerts and view 90-day price trends before buying." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PriceTrack — Real-Time Price Tracker" />
    <meta name="twitter:description" content="Track prices on Amazon & Flipkart in real time. Get instant email notifications when prices drop." />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,200;0,9..144,300;0,9..144,400;1,9..144,200;1,9..144,300;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- JSON-LD Structured Data for Search Engines -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PriceTrack",
        "url": "https://pricetrack.in",
        "applicationCategory": "ShoppingApplication",
        "operatingSystem": "All",
        "description": "Real-time price tracker and price drop notifier for e-commerce platforms like Amazon and Flipkart.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
